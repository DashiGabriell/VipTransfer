<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" role="img" aria-label="VipTransfer">
  <defs>
    <linearGradient id="vt-bronze-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4a46a"/>
      <stop offset="100%" stop-color="#8a6a38"/>
    </linearGradient>
  </defs>
  <!-- Mark: sedan profile in rounded square -->
  <g transform="translate(8,10)">
    <rect width="80" height="80" rx="18" fill="#152033"/>
    <!-- body -->
    <path
      d="M14 52
         C16 44 20 40 28 38
         L36 28 H52
         C58 28 62 32 64 38
         L70 42
         C72 43 74 46 74 50
         V54 H14 Z"
      fill="url(#vt-bronze-a)"/>
    <!-- cabin glass -->
    <path d="M38 30 H51 C55 30 58 33 59 37 H39 C38 33 38 30 38 30 Z" fill="#152033" opacity="0.45"/>
    <!-- wheels -->
    <circle cx="28" cy="54" r="6.5" fill="#0e1624"/>
    <circle cx="28" cy="54" r="3" fill="#c4a46a"/>
    <circle cx="60" cy="54" r="6.5" fill="#0e1624"/>
    <circle cx="60" cy="54" r="3" fill="#c4a46a"/>
    <!-- headlight accent -->
    <rect x="68" y="46" width="4" height="3" rx="1" fill="#f2ebe0" opacity="0.85"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(104,32)">
    <text x="0" y="24" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="0.5" fill="#152033">Vip</text>
    <text x="52" y="24" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="0.5" fill="#8a6a38">Transfer</text>
    <text x="0" y="48" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="600" letter-spacing="3.2" fill="#6e542c">MOBILIDADE EXECUTIVA</text>
  </g>
</svg>
