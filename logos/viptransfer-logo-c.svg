<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 110" role="img" aria-label="VipTransfer">
  <rect width="300" height="110" rx="14" fill="#0e1624"/>

  <!-- Front grille / headlights mark -->
  <g transform="translate(16,22)">
    <rect width="66" height="66" rx="16" fill="#152033" stroke="#b08d57" stroke-width="1.5"/>
    <!-- grille bars -->
    <rect x="18" y="28" width="30" height="3.2" rx="1" fill="#b08d57"/>
    <rect x="18" y="35" width="30" height="3.2" rx="1" fill="#8a6a38"/>
    <rect x="18" y="42" width="30" height="3.2" rx="1" fill="#b08d57"/>
    <!-- headlights -->
    <ellipse cx="14" cy="38" rx="5" ry="7" fill="#c4a46a"/>
    <ellipse cx="52" cy="38" rx="5" ry="7" fill="#c4a46a"/>
    <ellipse cx="14" cy="38" rx="2" ry="3" fill="#f2ebe0" opacity="0.7"/>
    <ellipse cx="52" cy="38" rx="2" ry="3" fill="#f2ebe0" opacity="0.7"/>
    <!-- hood line -->
    <path d="M22 22 H44" stroke="#6e542c" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <g transform="translate(100,34)">
    <text x="0" y="22" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#f2ebe0">Vip</text>
    <text x="48" y="22" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#b08d57">Transfer</text>
    <text x="0" y="46" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="500" letter-spacing="2.4" fill="#c4a46a">EXECUTIVO ? DISCRETO ? PONTUAL</text>
  </g>
</svg>
